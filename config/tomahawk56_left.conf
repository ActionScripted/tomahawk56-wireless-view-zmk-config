# The left half is the split central, so it can show both local and peripheral battery status.
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_0=6
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_1=7
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_2=8
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_3=9
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_4=10

# Right-half key events arrive over BLE into this queue and are drained on the
# system workqueue; the put is K_NO_WAIT, so anything that does not fit is
# dropped silently - a lost Space, or a lost release that leaves Cmd stuck. The
# stock depth of 5 is two and a half thumb rolls. Match the local kscan queue.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32

# Behavior sends to the peripheral (the RGB layer/brightness sync). When this
# queue is full, k_msgq_put blocks the caller for up to 100 ms; keep it deep
# enough that a burst of layer changes never reaches that path.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=16
