# The central shows both local and peripheral battery levels.
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_0=6
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_1=7
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_2=8
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_3=9
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_4=10

# Match the local scan queue; overflow silently drops peripheral releases.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32

# A full split-run queue blocks RGB synchronization for 100 ms.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=16
