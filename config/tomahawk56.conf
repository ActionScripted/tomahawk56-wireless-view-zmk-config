# Power management: idle after 3 minutes, sleep after 15 minutes.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=180000

# Bluetooth range and connection behavior.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Eager debouncing and enough queue depth for fast rollover.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32

# ZMK Studio for realtime keymap updates (USB, left half; see build.yaml snippet).
CONFIG_ZMK_STUDIO=y
# Unlock Studio with the orange Settings key before editing.
CONFIG_ZMK_STUDIO_LOCKING=y

# The keyboard powers its controller, display, RGB rail, and battery charger
# from VBUS while USB is attached. Advertise the Mikoto power path honestly so
# a hub allocates the full 500 mA available to a USB 2.0 device instead of the
# Zephyr defaults of self-powered and 100 mA.
CONFIG_USB_SELF_POWERED=n
CONFIG_USB_MAX_POWER=250

# Mouse movement, wheel, and buttons used by the Magic layer.
CONFIG_ZMK_POINTING=y

# USB logging costs significant battery - enable only while debugging.
# CONFIG_ZMK_USB_LOGGING=y

# nice!view display.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# No single-color backlight; the per-key LEDs are driven as underglow below.
CONFIG_ZMK_BACKLIGHT=n

# RGB underglow drives the 28 per-key LEDs through the local renderer module.
CONFIG_ZMK_RGB_UNDERGLOW=y
# Split RGB sends require more than the default 768-byte low-priority stack.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1280
# Auto-off darkens the board on USB, where ZMK does not enter deep sleep.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100

# Battery and connection overrides from the zmk-rgbled-widget fork.
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n
CONFIG_RGBLED_WIDGET_BOOT_SHOW_BATTERY=n
CONFIG_RGBLED_WIDGET_BOOT_SHOW_CONNECTIVITY=y
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=3000
CONFIG_RGBLED_WIDGET_CONN_STATUS_PIXEL=y
CONFIG_RGBLED_WIDGET_CONN_STATUS_PIXEL_INDEX=0
CONFIG_RGBLED_WIDGET_PAIRING_LED=y
# Widget palette: blue is connected/advertising; magenta is disconnected.
CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_ADVERTISING=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=5
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=3000
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXELS=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_LAYER_BLINK_MS=3000

# Leave headroom for the controller, display, and always-on RGB within the
# Mikoto's 500 mA VBUS fuse and the USB configuration's 500 mA power budget.
CONFIG_BOARD_MIKOTO_CHARGER_CURRENT_100MA=y

# Report both batteries rather than proxying the peripheral through the central.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
