# Power management: sleep after 15 min, dim/idle after 3 min.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=180000

# Bluetooth: max TX power for range, plus ZMK's improved connection settings.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Eager debouncing for fast typing.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
# Fast rollover can exceed ZMK's four-event default; dropped releases become false holds.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32

# ZMK Studio for realtime keymap updates (USB, left half; see build.yaml snippet).
CONFIG_ZMK_STUDIO=y
# Keep locking on: a Studio save pins bindings in settings flash that override
# the compiled keymap on every boot, and reflashing cannot dislodge them.
# Unlock with Magic + top-left corner; `make live-keymap` reports what is
# actually running. See the Diagnostics section of the README.
CONFIG_ZMK_STUDIO_LOCKING=y

# Mouse movement, wheel, and buttons used by the Magic layer.
CONFIG_ZMK_POINTING=y

# USB logging costs significant battery - enable only while debugging.
# CONFIG_ZMK_USB_LOGGING=y

# nice!view display.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# No single-color backlight; the per-key LEDs are driven as underglow below.
CONFIG_ZMK_BACKLIGHT=n

# RGB underglow drives the 28 per-key LEDs (see config/src/tomahawk56_layer_rgb.c).
CONFIG_ZMK_RGB_UNDERGLOW=y
# The layer RGB work runs here instead of the system workqueue so it can never
# delay split key delivery; it sends split behavior commands, so give the shared
# low-priority thread more headroom than the 768-byte stock stack.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1280
# Keep RGB on while the keyboard is awake; Magic provides an explicit toggle.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100

# Battery/BLE status indications on the RGB strip (zmk-rgbled-widget fork).
CONFIG_RGBLED_WIDGET=y
# Per-key layer colors are supplied by the local Tomahawk56 RGB module.
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n
CONFIG_RGBLED_WIDGET_BOOT_SHOW_BATTERY=n
CONFIG_RGBLED_WIDGET_BOOT_SHOW_CONNECTIVITY=y
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=3000
CONFIG_RGBLED_WIDGET_CONN_STATUS_PIXEL=y
CONFIG_RGBLED_WIDGET_CONN_STATUS_PIXEL_INDEX=0
CONFIG_RGBLED_WIDGET_PAIRING_LED=y
CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_ADVERTISING=4
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=3000
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXELS=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_LAYER_BLINK_MS=3000

# 350 mA charger current for large batteries.
CONFIG_BOARD_MIKOTO_CHARGER_CURRENT_350MA=y

# Split battery reporting: central fetches peripheral levels; report separately
# rather than proxying through the central's own level.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
