# The right half can only report its own battery status.
# Its local activity clock cannot distinguish left-hand typing from a dead
# split link; the layer RGB sync handles connected/disconnected auto-off.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_RGBLED_WIDGET_CONN_STATUS_PIXEL_INDEX=1
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_SELF=y
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_0=11
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_1=10
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_2=9
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_3=8
CONFIG_RGBLED_WIDGET_BATTERY_STATUS_PIXEL_4=7
