# CI matrix; scripts/build.sh builds the same board/shield combinations locally.
---
include:
  - board: mikoto@7.3.0//zmk
    shield: tomahawk56_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: mikoto@7.3.0//zmk
    shield: tomahawk56_right nice_view_adapter nice_view
  - board: mikoto@7.3.0//zmk
    shield: settings_reset
